{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greyteeks || Login</title>

  <link rel="shortcut icon" href="{% static 'assets/images/favicon.ico' %}" type="image/x-icon">
  <link rel="icon" href="{% static 'assets/images/favicon.ico' %}" type="image/x-icon">
  <!--- End favicon-->

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <!-- End google font  -->

  <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/magnific-popup.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/swiper-bundle.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/animate.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/custom-font.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/fontawesome.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/aos.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/slick.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/splitting.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/icomoon.css' %}">

  <!-- Code Editor  -->

  <link rel="stylesheet" href="{% static 'assets/css/main.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/app.min.css' %}">
</head>

<body class="light">

  <div class="sofax-preloader-wrap">
    <div class="sofax-preloader">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>

  <!-- progress bar -->

  <div class="progress-bar-container">
    <div class="progress-bar"></div>
  </div>

  <!-- progress circle -->
  <div class="paginacontainer">
    <div class="progress-wrap">
      <svg class="progress-circle svg-content" width="100%" height="100%" viewBox="-1 -1 102 102">
        <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98" />
      </svg>
      <div class="top-arrow">
        <img src="{% static 'assets/images/arrowtop.png' %}" alt="">
      </div>
    </div>
  </div>
  <!-- End All Js -->



  <section class="sofax-section-padding2">
    <div class="container">
      <div class="sofax-form-field-box">
        <div class="text-center mb-4 pb-3">
          <a href="{% url 'home' %}">
            <img src="{% static 'assets/images/logo/logo-dark.svg' %}" alt="Greyteeks" style="max-width: 160px; margin: 0 auto; display: block;">
          </a>
        </div>
        <h2>Welcome back</h2>
        <div class="sofax-field-box">

          <form action="{% url 'login' %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{% url 'dashboard' %}">
            <div class="sofax-main-field">
              <label>Username or Email</label>
              <input type="text" name="username" placeholder="Enter your username or email">
            </div>
            <div class="sofax-main-field sofax-subscription-field-inner">
              <label>Password</label>
              <input id="password-field" type="password" name="password" class="form-control" placeholder="Enter your password">
              <div toggle="#password-field" class="fa fa-fw fa-eye field-icon toggle-password"></div>
            </div>
            <div class="sofax-form-box forgot-password">
              <input type="checkbox" id="css" name="remember">
              <label for="css">
                Remember me
              </label>
              <a href="{% url 'password_reset' %}">Forget password?</a>
            </div>
            <button class="sofax-subcribe-btn2" type="submit">Sign In</button>
            <div class="login mt-24">
              <span>Don’t have an account?</span>
              <a href="{% url 'register' %}">
                <h4>Sign Up</h4>
              </a>
            </div>
            <div class="login-with-google mt-24">
              <a href="https://www.google.com/"><img src="{% static 'assets/images/contact/icon5.png' %}" alt="">
                <h5>Sign up with google</h5>
              </a>
            </div>
            <div class="form-bottom-text mt-24">
              <p>or, sign up with your email</p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>








  <!-- scripts -->
  <script src="{% static 'assets/js/jquery-3.7.1.js' %}"></script>
  <script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'assets/js/aos.js' %}"></script>
  <script src="{% static 'assets/js/menu/menu.js' %}"></script>
  <script src="{% static 'assets/js/isotope.pkgd.min.js' %}"></script>
  <script src="{% static 'assets/js/jquery.magnific-popup.min.js' %}"></script>
  <script src="{% static 'assets/js/swiper-bundle.min.js' %}"></script>
  <script src="{% static 'assets/js/countdown.js' %}"></script>
  <script src="{% static 'assets/js/slick.js' %}"></script>
  <script src="{% static 'assets/js/wow.min.js' %}"></script>
  <script src="{% static 'assets/js/modernizr.min.js' %}"></script>
  <script src="{% static 'assets/js/countdown.js' %}"></script>
  <script src="{% static 'assets/js/skill-bar.js' %}"></script>
  <script src="{% static 'assets/js/pricing-switcher.js' %}"></script>
  <script src="{% static 'assets/js/top-to-bottom.js' %}"></script>
  <script src="{% static 'assets/js/gsap.js' %}"></script>
  <script src="{% static 'assets/js/ScrollTrigger.js' %}"></script>
  <script src="{% static 'assets/js/SplitText.js' %}"></script>
  <script src="{% static 'assets/js/gsap-animation.js' %}"></script>


  <!-- <script src="{% static 'assets/js/scrollsmooth.js' %}"></script> -->
  <script src="{% static 'assets/js/accordion.js' %}"></script>
  <script src="https://maps.googleapis.com/maps/api/js?v=3&key=AIzaSyArZVfNvjnLNwJZlLJKuOiWHZ6vtQzzb1Y"></script>

  <script src="{% static 'assets/js/app.js' %}"></script>

</body>
</html>
