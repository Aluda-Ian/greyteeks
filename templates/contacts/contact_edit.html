{% extends "campaigns/dashboard.html" %}

{% block content %}
<div class="card border-0 shadow-sm p-4 rounded-4 mx-auto" style="max-width: 680px;">
    <div class="mb-4">
        <h4 class="fw-bold mb-1">Edit Contact</h4>
        <p class="text-muted mb-0">Update contact details or move it to a different group.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" value="{{ contact.name }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone_number" class="form-control" value="{{ contact.phone_number }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ contact.email }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Group</label>
                <select name="group" class="form-select" required>
                    {% for group in groups %}
                        <option value="{{ group.id }}" {% if contact.group.id == group.id %}selected{% endif %}>
                            {{ group.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="d-flex gap-3 mt-4">
            <a href="{% url 'contact_list' %}" class="btn btn-outline-secondary">Back to contacts</a>
            <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
    </form>
</div>
{% endblock %}
