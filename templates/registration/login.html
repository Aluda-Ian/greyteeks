{% extends "campaigns/dashboard.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4 card p-4 shadow-sm border-0">
            <h3 class="fw-bold text-center mb-3">Greyteeks Login</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    {{ form.username.label_tag }}
                    <input type="text" name="username" class="form-control">
                </div>
                <div class="mb-3">
                    {{ form.password.label_tag }}
                    <input type="password" name="password" class="form-control">
                </div>
                <input type="hidden" name="next" value="{% url 'dashboard' %}">
                <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
            </form>
            <div class="text-center mt-3">
                <p class="mb-1">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
                <p class="mb-0"><a href="{% url 'password_reset' %}">Forgot password?</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
