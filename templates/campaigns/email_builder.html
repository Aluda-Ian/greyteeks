{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ campaign.title }} | Email Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/grapesjs/dist/css/grapes.min.css" rel="stylesheet">
    <style>
        :root {
            --gt-charcoal: #1a202c;
            --gt-blue: #3182ce;
            --gt-blue-dark: #2563a6;
            --gt-surface: #edf2f7;
            --gt-border: #cbd5e0;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at top left, rgba(49, 130, 206, 0.16), transparent 30%),
                linear-gradient(180deg, #f8fafc 0%, #edf2f7 100%);
            color: var(--gt-charcoal);
            overflow: hidden;
        }

        .builder-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .builder-navbar {
            background: var(--gt-charcoal);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 45px rgba(26, 32, 44, 0.28);
            z-index: 20;
        }

        .builder-brand {
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .builder-brand span {
            color: #90cdf4;
        }

        .builder-stage {
            flex: 1;
            min-height: 0;
            padding: 0;
        }

        #gjs {
            height: calc(100vh - 72px);
            width: 100%;
            border-top: 1px solid rgba(49, 130, 206, 0.12);
        }

        .btn-venda {
            background: var(--gt-blue);
            border-color: var(--gt-blue);
            color: #fff;
        }

        .btn-venda:hover,
        .btn-venda:focus {
            background: var(--gt-blue-dark);
            border-color: var(--gt-blue-dark);
            color: #fff;
        }

        .gjs-one-bg {
            background-color: var(--gt-charcoal);
        }

        .gjs-two-color {
            color: #e2e8f0;
        }

        .gjs-three-bg {
            background-color: var(--gt-blue);
            color: #fff;
        }

        .gjs-four-color,
        .gjs-four-color-h:hover {
            color: #90cdf4;
        }

        .gjs-pn-panel,
        .gjs-cv-canvas {
            background-color: transparent;
        }

        .gjs-blocks-cs,
        .gjs-sm-sector,
        .gjs-trt-traits,
        .gjs-mdl-dialog,
        .gjs-layer {
            border-color: var(--gt-border);
        }

        .status-pill {
            border: 1px solid rgba(144, 205, 244, 0.35);
            color: #bee3f8;
            background: rgba(49, 130, 206, 0.16);
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        @media (max-width: 991.98px) {
            .builder-navbar .container-fluid {
                gap: 0.75rem;
            }

            .builder-actions {
                width: 100%;
                justify-content: stretch;
            }

            .builder-actions .btn,
            .builder-actions .status-pill {
                flex: 1;
                justify-content: center;
            }

            #gjs {
                height: calc(100vh - 134px);
            }
        }
    </style>
</head>
<body>
    <div class="builder-shell">
        <nav class="navbar navbar-dark builder-navbar px-3 py-3">
            <div class="container-fluid px-0 d-flex flex-wrap align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <a href="{{ back_url }}" class="btn btn-outline-light btn-sm">Back to Campaign</a>
                    <div>
                        <div class="builder-brand">Greyteeks <span>Advanced Newsletter Suite</span></div>
                        <div class="text-light-emphasis small">{{ campaign.title }}</div>
                    </div>
                </div>
                <div class="builder-actions d-flex align-items-center gap-2 flex-wrap">
                    <div id="save-status" class="status-pill">Ready to design</div>
                    <button id="send-test-email" type="button" class="btn btn-outline-light btn-sm">Send Test Email</button>
                    <button id="save-design" type="button" class="btn btn-venda btn-sm px-3">Save Design</button>
                </div>
            </div>
        </nav>

        <main class="builder-stage">
            <div id="gjs"></div>
        </main>
    </div>

    {{ campaign.design_json|json_script:"initial-design-data" }}
    <textarea id="initial-html" class="d-none">{{ campaign.html_content|default_if_none:'' }}</textarea>
    <input id="csrf-token" type="hidden" value="{{ csrf_token }}">
    <script src="https://unpkg.com/grapesjs"></script>
    <script src="https://unpkg.com/grapesjs-preset-newsletter"></script>
    <script>
        const initialDesign = JSON.parse(document.getElementById('initial-design-data').textContent || 'null');
        const initialHtml = document.getElementById('initial-html').value;
        const csrfToken = document.getElementById('csrf-token').value;
        const saveButton = document.getElementById('save-design');
        const sendTestButton = document.getElementById('send-test-email');
        const statusPill = document.getElementById('save-status');

        const editor = grapesjs.init({
            container: '#gjs',
            height: '100%',
            width: 'auto',
            fromElement: false,
            storageManager: false,
            noticeOnUnload: false,
            plugins: ['grapesjs-preset-newsletter'],
            pluginsOpts: {
                'grapesjs-preset-newsletter': {
                    modalLabelImport: 'Paste your newsletter HTML here',
                    modalLabelExport: 'Copy the rendered newsletter HTML',
                    importPlaceholder: '<table><tr><td>Stylish Nerd newsletter</td></tr></table>',
                }
            },
            canvas: {
                styles: [
                    'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'
                ]
            }
        });

        const defaultContent = `
            <table width="100%" cellpadding="0" cellspacing="0" style="background:#f7fafc;padding:40px 0;">
                <tr>
                    <td align="center">
                        <table width="640" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(26,32,44,0.10);">
                            <tr>
                                <td style="background:#1a202c;padding:28px 40px;text-align:left;">
                                    <div style="font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#90cdf4;font-weight:700;">Greyteeks Digest</div>
                                    <h1 style="margin:14px 0 0;font-size:34px;line-height:1.15;color:#ffffff;font-weight:800;">Build a bold newsletter that feels engineered, not generic.</h1>
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:36px 40px 18px;color:#2d3748;font-size:16px;line-height:1.75;">
                                    Start with the newsletter blocks on the left, remix the layout, and shape a polished campaign in the Stylish Nerd palette.
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:0 40px 40px;">
                                    <a href="https://greyteeks.com" style="display:inline-block;background:#3182ce;color:#ffffff;text-decoration:none;padding:14px 22px;border-radius:999px;font-weight:700;">Launch Something Smart</a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        `;

        if (initialDesign) {
            editor.loadProjectData(initialDesign);
        } else if (initialHtml.trim()) {
            editor.setComponents(initialHtml);
        } else {
            editor.setComponents(defaultContent);
        }

        function setStatus(message, tone = 'info') {
            statusPill.textContent = message;
            if (tone === 'success') {
                statusPill.style.background = 'rgba(56, 161, 105, 0.18)';
                statusPill.style.borderColor = 'rgba(56, 161, 105, 0.4)';
                statusPill.style.color = '#c6f6d5';
                return;
            }
            if (tone === 'error') {
                statusPill.style.background = 'rgba(229, 62, 62, 0.18)';
                statusPill.style.borderColor = 'rgba(229, 62, 62, 0.4)';
                statusPill.style.color = '#fed7d7';
                return;
            }
            statusPill.style.background = 'rgba(49, 130, 206, 0.16)';
            statusPill.style.borderColor = 'rgba(144, 205, 244, 0.35)';
            statusPill.style.color = '#bee3f8';
        }

        function buildEmailHtml() {
            const html = editor.getHtml();
            const css = editor.getCss();
            return css ? `<style>${css}</style>${html}` : html;
        }

        editor.on('update', () => setStatus('Unsaved changes'));

        saveButton.addEventListener('click', async () => {
            const html = buildEmailHtml();
            const design = editor.getProjectData();

            setStatus('Saving...');
            saveButton.disabled = true;

            try {
                const response = await fetch('{{ save_url }}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken,
                    },
                    body: JSON.stringify({ html, design }),
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Unable to save this design.');
                }

                setStatus(data.message || 'Design saved', 'success');
            } catch (error) {
                setStatus(error.message, 'error');
            } finally {
                saveButton.disabled = false;
            }
        });

        sendTestButton.addEventListener('click', async () => {
            const recipient = window.prompt('Send a test email to which address?');
            if (!recipient) {
                return;
            }

            sendTestButton.disabled = true;
            setStatus('Sending test email...');

            try {
                const response = await fetch('{{ test_url }}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken,
                    },
                    body: JSON.stringify({
                        recipient,
                        subject: '{{ campaign.title|escapejs }}',
                        html_content: buildEmailHtml(),
                        provider_id: '{{ campaign.email_server_id|default_if_none:"" }}',
                    }),
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Unable to send the test email.');
                }

                setStatus(data.message || 'Test email sent', 'success');
            } catch (error) {
                setStatus(error.message, 'error');
            } finally {
                sendTestButton.disabled = false;
            }
        });
    </script>
</body>
</html>
