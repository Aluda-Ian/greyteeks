{% extends "campaigns/dashboard.html" %}

{% block content %}
<div class="card p-4 shadow-sm">
    <h3>Create New Campaign</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div class="mb-3">
            <button type="button" class="btn btn-info text-white" onclick="generateAI()">
                ✨ Generate with AI
            </button>
        </div>

        <button type="submit" class="btn btn-primary w-100">Save Campaign</button>
    </form>
</div>

<script>
function generateAI() {
    const topic = prompt("What is this campaign about? (e.g., Flash Sale, Welcome Message)");
    if (topic) {
        fetch(`/api/ai-suggest/?topic=${topic}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('messageBody').value = data.suggestion;
            });
    }
}
</script>
{% endblock %}
