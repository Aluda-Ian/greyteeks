{% load static %}
<header class="site-header py-3 shadow-sm bg-white light-surface">
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
                <img src="{% static 'img/dark logo.svg' %}" class="logo logo-dark me-2" alt="Greyteeks dark logo">
                <img src="{% static 'img/light logo.svg' %}" class="logo logo-light me-2" alt="Greyteeks light logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    {% if user.is_authenticated %}
                        <a class="btn btn-outline-primary btn-sm" href="{% url 'dashboard' %}">Dashboard</a>
                        <form action="{% url 'logout' %}" method="post" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-primary btn-sm">Logout</button>
                        </form>
                    {% else %}
                        {% if request.resolver_match.url_name == 'home' %}
                            <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
                            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#registerModal">Get Started</button>
                        {% else %}
                            <a class="btn btn-outline-primary btn-sm" href="{% url 'login' %}">Login</a>
                            <a class="btn btn-primary btn-sm" href="{% url 'register' %}">Get Started</a>
                        {% endif %}
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
</header>
