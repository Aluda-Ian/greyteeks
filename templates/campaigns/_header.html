{% load static %}
<style>
  /* Modern Glassmorphism Sticky Header Override */
  .custom-premium-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background-color: rgba(255, 255, 255, 0.85);
    /* Light translucent */
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    /* Safari support */
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
    /* Subtle shadow float */
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    /* Smooth scroll transition */
    padding: 10px 0;
    /* Padding for breathability */
  }

  /* Adjust the original header height dependency and avoid dark-bg rules */
  body .custom-premium-header {
    background-image: none !important;
  }

  /* Add padding to the body so the fixed header does not cover the first section */
  body {
    padding-top: 90px;
  }

  /* Navigation Link Typography and Hover Micro-Animation */
  .custom-premium-header .nav-link-item {
    position: relative;
    color: #1f2937 !important;
    /* Dark Slate Gray */
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0.3px;
    transition: color 0.3s ease;
    text-decoration: none;
    padding: 10px 15px;
    /* Increase click area */
  }

  /* Link Underline Micro-Animation */
  .custom-premium-header .nav-link-item::after {
    content: '';
    position: absolute;
    width: 0;
    height: 2px;
    bottom: -2px;
    /* Offset below text */
    left: 50%;
    background-color: #0f172a;
    /* Deep Slate marker */
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    transform: translateX(-50%);
    border-radius: 2px;
  }

  .custom-premium-header .nav-link-item:hover {
    color: #0f172a !important;
    /* Deeper hover state */
  }

  .custom-premium-header .nav-link-item:hover::after {
    width: 80%;
    /* Expand to cover line */
  }

  /* Login Text Button CTA - minimalist and elegant */
  .cta-login-btn {
    color: #4b5563 !important;
    /* Subtle gray */
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
    padding: 8px 16px;
    border-radius: 8px;
    margin-right: 10px;
  }

  .cta-login-btn:hover {
    color: #0f172a !important;
    background-color: rgba(15, 23, 42, 0.05);
    /* Slight dark overlay */
  }

  /* Get Started Primary Pill Button */
  .cta-primary-pill {
    background: #0f172a !important;
    /* Deep dark indigo/slate */
    color: #ffffff !important;
    font-weight: 600;
    padding: 12px 28px !important;
    border-radius: 50px !important;
    /* Perfect Pill */
    border: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  .cta-primary-pill:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.3);
    background: #1e293b !important;
    /* Lighter hover state */
    color: #ffffff !important;
  }

  /* Logo Sizing */
  .custom-premium-logo {
    width: 350px !important;
    /* Force the width so SVG does not collapse to 0x0 */
    max-width: 100%;
    height: auto !important;
    display: block;
  }

  /* Mobile specific styling to override light/dark mode clashes */
  .custom-premium-header .mobile-menu-trigger span,
  .custom-premium-header .mobile-menu-trigger span::before,
  .custom-premium-header .mobile-menu-trigger span::after {
    background-color: #0f172a !important;
    /* Dark hamburger icon */
  }
</style>

<!-- Removed "sofax-header-section sticky-menu dark-bg" completely. Added custom glass classes -->
<header class="site-header site-header--menu-center custom-premium-header" id="custom-glass-header">
  <div class="container">
    <nav class="navbar site-navbar">

      <!-- Brand Logo Configured for Light BG -->
      <a class="brand-logo" href="{% url 'home' %}">
        <img src="{% static 'assets/images/logo/logo-dark.svg' %}" class="custom-premium-logo" alt="Greyteeks logo">
      </a>

      <div class="menu-block-wrapper">
        <div class="menu-overlay"></div>
        <nav class="menu-block" id="append-menu-header">
          <div class="mobile-menu-head">
            <div class="go-back">
              <i class="fa fa-angle-left"></i>
            </div>
            <div class="current-menu-title"></div>
            <div class="mobile-menu-close">&times;</div>
          </div>
          <!-- Menu Items with custom hover styling automatically applied -->
          <ul class="site-menu-main">
            <li class="nav-item"><a href="{% url 'home' %}" class="nav-link-item">Home</a></li>
            <li class="nav-item"><a href="{% url 'about' %}" class="nav-link-item">About</a></li>
            <li class="nav-item"><a href="{% url 'services' %}" class="nav-link-item">Services</a></li>
            <li class="nav-item"><a href="{% url 'pricing' %}" class="nav-link-item">Pricing</a></li>
            <li class="nav-item"><a href="{% url 'faq' %}" class="nav-link-item">FAQ</a></li>
            <li class="nav-item"><a href="{% url 'contact' %}" class="nav-link-item">Contact</a></li>
          </ul>
        </nav>
      </div>

      <!-- Premium CTAs -->
      <div class="header-btn header-three-site-btn header-btn-l1 ms-auto d-flex align-items-center">
        <!-- New Login Style -->
        <a class="cta-login-btn" href="{% url 'sign_in' %}">
          Login
        </a>
        <!-- New Primary Get Started Style -->
        <a class="cta-primary-pill" href="{% url 'register' %}">
          Get started
        </a>
      </div>

      <!-- Mobile hamburger -->
      <div class="mobile-menu-trigger"><span></span></div>

    </nav>
  </div>
</header>
