{% load static %}
<header class="site-header">
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-4 px-lg-5">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
                <img src="{% static 'img/dark logo.svg' %}" class="header-logo" alt="Greyteeks logo">
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon text-white"><i class="bi bi-list"></i></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    {% if user.is_authenticated %}
                        <a class="btn btn-header-ghost btn-sm" href="{% url 'dashboard' %}">Dashboard</a>
                        <form action="{% url 'logout' %}" method="post" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-header-primary btn-sm">Logout</button>
                        </form>
                    {% else %}
                        {% if request.resolver_match.url_name == 'home' %}
                            <button class="btn btn-header-ghost btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
                            <button class="btn btn-header-primary btn-sm" data-bs-toggle="modal" data-bs-target="#registerModal">Get Started</button>
                        {% else %}
                            <a class="btn btn-header-ghost btn-sm" href="{% url 'login' %}">Login</a>
                            <a class="btn btn-header-primary btn-sm" href="{% url 'register' %}">Get Started</a>
                        {% endif %}
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
</header>
